site_name: HemOnc Alchemy
site_description: Typed SQLAlchemy models and query tools for HemOnc.org oncology terminology
site_url: https://AustralianCancerDataNetwork.github.io/HemOnc_Alchemy/
repo_url: https://github.com/AustralianCancerDataNetwork/HemOnc_Alchemy
repo_name: HemOnc_Alchemy

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - footnotes
  - tables
  - attr_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - js/mermaid-init.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            show_source: false
            docstring_style: google
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md

  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Quickstart: getting-started/quickstart.md
      - Local development: getting-started/local-development.md
      - Updating an existing setup: getting-started/upgrading.md

  - Understanding HemOnc:
      - Overview: model/index.md
      - Entities and generated models: model/entities.md
      - Relationships and cross-references: model/relationships.md
      - Loading data: model/loading.md

  - Toolkit:
      - Overview: toolkit/index.md
      - Core queries and links: toolkit/core.md
      - Treatment analytics: toolkit/treatment.md
      - Schedules and administration: toolkit/scheduling.md

  - Integrations:
      - OMOP: integrations/omop.md

  - Reference:
      - API overview: reference/index.md
      - Model entities: reference/entities.md
      - Toolkit API: reference/toolkit.md
      - CLI: reference/cli.md

  - Maintainers:
      - Regenerating the model: maintainers/regeneration.md
      - Contributing and releases: maintainers/release-process.md
