name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  label-gate:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/label-gate.yml@main

  build-test:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test.yml@main
    with:
      python-version: "3.12"
      ty-src: hemonc_alchemy/cli.py hemonc_alchemy/config.py hemonc_alchemy/bootstrap.py hemonc_alchemy/integrations

  duckdb:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test-duckdb.yml@main
    with:
      python-version: "3.12"
      markers: duckdb
      ty-src: hemonc_alchemy/cli.py hemonc_alchemy/config.py hemonc_alchemy/bootstrap.py hemonc_alchemy/integrations

  postgres:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test-postgres.yml@main
    with:
      python-version: "3.12"
      postgres-db: test
      postgres-user: test
      postgres-password: test
      # The generated model and loader use dynamic SQLAlchemy/pandas types
      # that are not yet clean under ty. Keep the shared check focused on the
      # typed public/configuration boundary until those surfaces are annotated.
      ty-src: hemonc_alchemy/cli.py hemonc_alchemy/config.py hemonc_alchemy/bootstrap.py hemonc_alchemy/integrations
      setup-commands: |
        # This shared workflow runs bare pytest. Environment addopts follow
        # project addopts, so this explicitly selects our PostgreSQL axis.
        echo 'PYTEST_ADDOPTS=-m postgres' >> "$GITHUB_ENV"
        echo 'HEMONC_REQUIRE_POSTGRES=1' >> "$GITHUB_ENV"
        mkdir -p "$HOME/.config/omop"
        install -m 600 .github/config.postgres.toml "$HOME/.config/omop/config.toml"

  installed-wheel:
    uses: ./.github/workflows/wheel-smoke.yml
